<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 2 - From Kontak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Formulir Kontak</h1>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="resume.html">Resume</a></li>
                <li><a href="project.html">Project</a></li>
                <li><a href="kontak.html">Hubungi Saya</a></li>
            </ul>
        </nav>
    </header>
    <hr>
    <main>
        <section>
            <h2>Kirimkan Pesan atau Penawaran Proyek
                <form>
                    <p>
                        <label for=""nama_pengirim">Nama lengkap anda:</label><br>
                        <input type="text" id="nama_pengirim" name="nama_pengirim">
                    </p>
                    <p>
                        <label for="email_pengirim">Alamat Email:</label><br>
                        <input type="email" id="email_pengirim" name="email_pengirim">
                    </p>
                    <p>
                        <label for="jenis_layanan">Jenis Layanan yang dibutuhkan:</label><br>
                        <select id="jenis_layanan" name="jenis_layanan">
                            <option value="">-- Pilih jenis layanan --</option>
                            <option value="web">Pembuatan Web</option>
                            <option value="app">Pengembangan Aplikasi</option>
                            <option value="other">Lain-lain</option>
                        </select>
                    </p>
                    <p>
                        <label for="pesan">Pesan:</label><br>
                        <textarea id="pesan" name="pesan" rows="6" cols="50"></textarea>
                    </p>
                    <p>
                        <button type="submit">Kirim Pesan</button>
                        <button type="reset">Reset / batal</button>
                    </p>
                </form>
            </h2>
        </section>
    </main>
    <hr>
